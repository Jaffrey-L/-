<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Daily Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="bg"></div>
  <header class="hero shell">
    <div>
      <h1>AI Daily Radar</h1>
      <p>&#20013;&#33521;&#21452;&#35821;&#21069;&#27839;&#24773;&#25253;&#65292;&#22269;&#22806;&#20248;&#20808;&#65292;&#32858;&#28966;&#20225;&#19994;&#24212;&#29992;&#19982;&#23454;&#25112;&#26041;&#27861;&#12290;</p>
    </div>
    <div class="badges">
      <span>&#26085;&#25253;&#27169;&#24335;</span>
      <span>A/B/C &#20449;&#28304;&#20998;&#32423;</span>
      <span>PC &#20248;&#20808;&#29256;</span>
    </div>
  </header>

  <section class="shell overview" aria-label="Daily summary">
    <article class="kpi">
      <small>&#20170;&#26085;&#24635;&#26465;&#30446;</small>
      <strong id="kpiTotal">-</strong>
    </article>
    <article class="kpi">
      <small>&#20225;&#19994;&#24212;&#29992;&#30456;&#20851;</small>
      <strong id="kpiEnterprise">-</strong>
    </article>
    <article class="kpi">
      <small>A&#32423;&#20449;&#28304;&#21344;&#27604;</small>
      <strong id="kpiAGrade">-</strong>
    </article>
    <article class="kpi">
      <small>&#23454;&#25112;&#26041;&#27861;&#26465;&#30446;</small>
      <strong id="kpiPractice">-</strong>
    </article>
  </section>

  <main class="shell layout">
    <aside class="panel filters">
      <h2>&#31579;&#36873;&#22120;</h2>
      <label>&#20998;&#31867;<select id="categoryFilter"></select></label>
      <label>&#20449;&#28304;&#32423;&#21035;
        <select id="gradeFilter">
          <option value="all">&#20840;&#37096;</option>
          <option value="A">A&#32423;</option>
          <option value="B">B&#32423;</option>
          <option value="C">C&#32423;</option>
        </select>
      </label>
      <label>&#26469;&#28304;<select id="sourceFilter"></select></label>
      <div class="date-presets" aria-label="Date presets">
        <button class="preset-btn" type="button" data-days="7">&#26368;&#36817;7&#22825;</button>
        <button class="preset-btn active" type="button" data-days="30">&#26368;&#36817;30&#22825;</button>
        <button class="preset-btn" type="button" data-days="all">&#20840;&#37096;</button>
      </div>
      <label>&#24320;&#22987;&#26085;&#26399;<input id="startDateFilter" type="date"></label>
      <label>&#32467;&#26463;&#26085;&#26399;<input id="endDateFilter" type="date"></label>
      <label>&#20851;&#38190;&#35789;<input id="searchInput" type="text" placeholder="OpenAI / Agent / Vibe"></label>
      <label>&#25490;&#24207;
        <select id="sortFilter">
          <option value="latest">&#25353;&#26102;&#38388;&#65288;&#26368;&#26032;&#65289;</option>
          <option value="importance">&#25353;&#37325;&#35201;&#32423;&#21035;</option>
        </select>
      </label>
      <button id="resetBtn" type="button">&#37325;&#32622;&#31579;&#36873;</button>
    </aside>

    <section class="panel stream">
      <div class="stream-header">
        <h2>&#20170;&#26085;&#20449;&#24687;&#27969;</h2>
        <p id="resultCount"></p>
      </div>
      <div id="newsList" class="news-list"></div>
    </section>
  </main>

  <section class="panel sources shell">
    <h2>&#26680;&#24515;&#26469;&#28304;&#27744;</h2>
    <div class="source-groups">
      <article><h3>&#26680;&#24515;AI&#20844;&#21496;</h3><ul id="companySources"></ul></article>
      <article><h3>&#26680;&#24515;AI&#21338;&#20027;</h3><ul id="creatorSources"></ul></article>
      <article><h3>AI&#20010;&#20154;&#20844;&#21496;&#22823;&#31070;</h3><ul id="soloSources"></ul></article>
    </div>
  </section>

  <footer class="shell">
    <p>&#25968;&#25454;&#26469;&#28304;&#65306;<code>data/news.json</code>&#65292;&#27599; 12 &#23567;&#26102;&#33258;&#21160;&#21516;&#27493;&#12290;</p>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
